name: Compile Windows Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Show .NET SDK
        run: dotnet --info

      - name: Inspect Windows SDK
        shell: pwsh
        run: |
          Write-Host "Windows SDK root:"
          Write-Host "C:\Program Files (x86)\Windows Kits\10"

          Write-Host "`nInstalled Windows SDK versions:"
          Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\Platforms\UAP" `
            -Directory `
            -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name

          Write-Host "`nChecking required SDK..."

          $platform = "C:\Program Files (x86)\Windows Kits\10\Platforms\UAP\10.0.26100.0\Platform.xml"

          if (!(Test-Path $platform)) {
            Write-Error "Required Windows SDK metadata not found:"
            Write-Error $platform
            exit 1
          }

          Write-Host "FOUND:"
          Write-Host $platform

      - name: Clean
        shell: pwsh
        run: |
          Get-ChildItem `
            -Path . `
            -Include bin,obj `
            -Directory `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Remove-Item `
              -Recurse `
              -Force `
              -ErrorAction SilentlyContinue

      - name: Restore
        run: dotnet restore -r win-x64

      - name: Build
        run: dotnet build -c Release -r win-x64 --no-restore

      - name: Publish
        run: >
          dotnet publish
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true
          -o ./build-output

      - name: Verify
        shell: pwsh
        run: |
          $exe = "./build-output/ShareHelper.exe"

          if (!(Test-Path $exe)) {
            Write-Error "ShareHelper.exe was not generated."
            exit 1
          }

          $file = Get-Item $exe

          Write-Host "Build successful."
          Write-Host "File: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ShareHelper-Binary
          path: ./build-output/ShareHelper.exe
          if-no-files-found: error