name: Compile Windows Executable

on:
  workflow_dispatch: # Allows you to manually trigger the compiler button

jobs:
  build:
    runs-on: windows-latest # Compiles on a native Windows cloud server

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Compile Single-File EXE
      run: |
        dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o ./build-output

    - name: Upload Finished Executable
      uses: actions/upload-artifact@v4
      with:
        name: ShareHelper-Binary
        path: ./build-output/ShareHelper.exe
