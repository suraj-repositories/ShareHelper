name: Compile Windows Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check .NET SDK
        run: dotnet --info

      - name: Check Windows SDK
        shell: pwsh
        run: |
          Write-Host "Windows SDK directories:"

          Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\Lib" `
            -Directory |
            Select-Object -ExpandProperty Name

      - name: Clean
        shell: pwsh
        run: |
          Remove-Item `
            -Recurse `
            -Force `
            "bin",
            "obj" `
            -ErrorAction SilentlyContinue

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish
        run: >
          dotnet publish
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true
          -o ./build-output

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "./build-output/ShareHelper.exe")) {
            Write-Error "ShareHelper.exe was not generated."
            exit 1
          }

          Write-Host "ShareHelper.exe successfully generated."
          Get-Item "./build-output/ShareHelper.exe"

      - name: Upload Finished Executable
        uses: actions/upload-artifact@v4
        with:
          name: ShareHelper-Binary
          path: ./build-output/ShareHelper.exe
          if-no-files-found: error