name: Compile Windows Executable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Show .NET Information
        run: dotnet --info

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build ShareHelper
        run: |
          dotnet build `
            -c Release `
            --no-restore

      - name: Publish Single-File Windows EXE
        run: |
          dotnet publish `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=true `
            -o ./build-output

      - name: Verify Executable
        run: |
          if (!(Test-Path "./build-output/ShareHelper.exe")) {
            Write-Error "ShareHelper.exe was not generated."
            exit 1
          }

          Get-Item "./build-output/ShareHelper.exe"

      - name: Upload Finished Executable
        uses: actions/upload-artifact@v4
        with:
          name: ShareHelper-Binary
          path: ./build-output/ShareHelper.exe
          if-no-files-found: error